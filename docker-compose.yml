# CodeLeap API Docker Compose Configuration
#
# NOTE: This compose file only contains the CodeLeap API service.
# Keycloak must be started separately from the keycloak/ directory.
#
# To run the full stack:
# 1. Start Keycloak: cd keycloak && docker-compose up -d
# 2. Start API: docker-compose up -d (from this directory)

services:
  # CodeLeap API Service (using AWS PostgreSQL)
  codeleap-api:
    build:
      context: .
      dockerfile: src/CodeLeap.API/Dockerfile
    container_name: codeleap-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ConnectionStrings__aws_postgres_url=HOST=stockpos.c18eoyyecdq1.ap-southeast-1.rds.amazonaws.com;Port=5432;Database=codeleap_postgres_test;Username=stockposadmin;Password=_?S%[vPsk7eo
      - Keycloak__auth-server-url=http://keycloak:8080
      - Keycloak__realm=CodeLeap
      - Keycloak__resource=codeleap-api
      - Keycloak__ssl-required=none
      - Keycloak__verify-token-audience=false
      - Keycloak__credentials__secret=codeleap-api-secret
    ports:
      - "5001:80"
    networks:
      - codeleap-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  codeleap-network:
    name: codeleap-network
    external: true  # Network is created by keycloak/docker-compose.yml
